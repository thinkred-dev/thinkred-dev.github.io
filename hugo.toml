baseURL = 'https://thinkred.dev/'
locale = 'en-us'
title = 'Think Red'
theme = 'PaperMod'

enableRobotsTXT = true
enableGitInfo = false        # don't leak commit metadata into pages
buildDrafts = false
buildFuture = false
disableKinds = []

[pagination]
  pagerSize = 10

[outputs]
  home = ['HTML', 'RSS', 'JSON']   # JSON powers the on-site search

[taxonomies]
  tag = 'tags'
  category = 'categories'
  series = 'series'
  attack = 'attack'               # MITRE ATT&CK technique IDs, e.g. T1558.003

[markup]
  [markup.goldmark.renderer]
    unsafe = false                # never pass raw HTML from Markdown through
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = false
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

# Privacy: no third-party embeds or trackers
[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    disable = true
  [privacy.instagram]
    disable = true
  [privacy.vimeo]
    disable = true
  [privacy.x]
    disable = true
  [privacy.youTube]
    privacyEnhanced = true

[services]
  [services.rss]
    limit = 20

[params]
  env = 'production'
  description = 'Red team tradecraft, explained, and how defenders catch it.'
  author = 'Josh Villagomez'
  keywords = ['red team', 'adversary emulation', 'offensive security', 'MITRE ATT&CK', 'detection engineering']
  mainSections = ['blog', 'labs', 'papers', 'notes']
  defaultTheme = 'dark'
  disableThemeToggle = true      # dark-only site
  DateFormat = 'January 2, 2006'

  ShowReadingTime = true
  ShowWordCount = false
  ShowToc = true
  TocOpen = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = false
  disableSpecial1stPost = false
  comments = false

  [params.homeInfoParams]
    Title = 'Think Red'
    Content = """
I'm Josh — I spent ~25 years defending identity and infrastructure, then crossed to the offensive side to get better at it.

*Think Red* is my field notebook: red team tradecraft in plain terms, mapped to MITRE ATT&CK and always paired with how defenders catch it. Lab-tested, authorized-only, identity-flavored. [More about me »](/about/)
"""

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/thinkred-dev'
  [[params.socialIcons]]
    name = 'linkedin'
    url = 'https://www.linkedin.com/in/jvillago'
  [[params.socialIcons]]
    name = 'rss'
    url = '/index.xml'

  [params.label]
    text = 'thinkred'               # header logo renders as root@thinkred:~#
    # avatar is rendered via CSS (.logo::before) with a root-relative URL so it
    # works under http or https; the theme's label.icon emits an absolute URL.

  [params.assets]
    disableFingerprinting = false   # keep SRI integrity hashes on CSS/JS
    theme_color = '#0a0a0c'         # browser UI / PWA theme color (matches --theme)

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 2
    keys = ['title', 'permalink', 'summary', 'content']

  [params.footer]
    text = 'Views are my own. Content is for education and authorized testing only.'

[menus]
  [[menus.main]]
    name = 'Blog'
    pageRef = '/blog'
    weight = 10
  [[menus.main]]
    name = 'Labs'
    pageRef = '/labs'
    weight = 20
  [[menus.main]]
    name = 'Papers'
    pageRef = '/papers'
    weight = 30
  [[menus.main]]
    name = 'Tools'
    pageRef = '/tools'
    weight = 40
  [[menus.main]]
    name = 'Notes'
    pageRef = '/notes'
    weight = 50
  [[menus.main]]
    name = 'ATT&CK'
    pageRef = '/attack'
    weight = 60
  [[menus.main]]
    name = 'Search'
    pageRef = '/search'
    weight = 70
  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 80
